name: Build VMS Android APK

on:
  workflow_dispatch: # อนุญาตให้กดสั่ง Build ได้ด้วยตนเองผ่านหน้าเว็บ GitHub
  push:
    branches: [ main, master ]
    paths:
      - 'android-smartcard-bridge/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK with Gradle
        run: |
          cd android-smartcard-bridge
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VMS-SmartCard-Bridge-App
          path: android-smartcard-bridge/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
